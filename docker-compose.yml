services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chachat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chachat}
      POSTGRES_DB: ${POSTGRES_DB:-chachat_funnel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chachat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chachat:chachat@db:5432/chachat_funnel}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
